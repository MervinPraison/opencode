name: Pull local clone

on:
  workflow_run:
    workflows: ["Sync fork with upstream"]
    types: [completed]

jobs:
  pull:
    if: >-
      vars.MAC_RUNNER == 'true' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS]
    steps:
      - name: Sync local OpenCode clone to fork dev
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/opencode"
          if [[ ! -d "$dir/.git" ]]; then
            echo "Skip $dir (not a git repo)"
            exit 0
          fi
          echo "Syncing $dir"
          git -C "$dir" fetch origin dev
          git -C "$dir" reset --hard origin/dev
          git -C "$dir" log -1 --oneline
